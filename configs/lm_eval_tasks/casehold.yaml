# CaseHOLD (Zheng et al. 2021): pick the correct holding statement for a cited case.
# 5-way multiple choice, loglikelihood scored, 0-shot. Loaded from the Hub's auto-converted
# parquet branch because the repo itself is a loading script (unsupported by datasets >= 4).
task: casehold
dataset_path: casehold/casehold
dataset_kwargs:
  revision: refs/convert/parquet
  data_files:
    test: all/test/0000.parquet
output_type: multiple_choice
training_split: null
validation_split: null
test_split: test
process_docs: !function casehold_utils.process_docs
doc_to_text: !function casehold_utils.doc_to_text
doc_to_choice: !function casehold_utils.doc_to_choice
doc_to_target: !function casehold_utils.doc_to_target
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
