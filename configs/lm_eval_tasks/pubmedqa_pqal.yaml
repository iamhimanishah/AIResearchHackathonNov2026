# PubMedQA (labelled, 1k items) on the parquet mirror. lm-eval's built-in `pubmedqa` task points at
# bigbio/pubmed_qa, a loading-script dataset that datasets>=4 refuses to load. Prompt format is
# identical to the built-in task; only the dataset source and field names differ.
task: pubmedqa_pqal
dataset_path: qiaojin/PubMedQA
dataset_name: pqa_labeled
output_type: multiple_choice
training_split: null
validation_split: null
test_split: train
doc_to_text: !function pubmedqa_pqal_utils.doc_to_text
doc_to_target: !function pubmedqa_pqal_utils.doc_to_target
doc_to_choice: ["yes", "no", "maybe"]
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
