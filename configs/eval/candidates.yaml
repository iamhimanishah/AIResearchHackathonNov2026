  suite: candidates
  item_seed: 20260905
  batch_size: 4
  max_length: 2048       # CaseHOLD prompts are long; 4 x 2048 x 262k fp32 logits = 8.6 GB, so batch 1 there
  include_path: configs/lm_eval_tasks
