# Deliverable 2: every tier-1 / tier-2 *candidate* for the protected set, baselined on base
# Gemma 3 1B PT to decide what survives. Item counts are subsets sized for a prune decision
# (~±2% standard error), not the final suite sizes. num_fewshot follows each task's standard.
# The final frozen suite is declared separately after Justin's call (tier1.yaml / tier2.yaml).
