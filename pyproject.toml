[project]
name = "clharness"
version = "0.0.1"
description = "Remember: a continual-learning harness for small open LLMs: streaming fine-tuning, fixed eval suite, Gemma Scope feature tracking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.14,<2.15",
    "transformers>=5.16,<6",
    "sae-lens>=6.50,<7",
    "lm-eval[hf]>=0.4.13,<0.5",
    "peft>=0.17",
    "datasets>=3.1",
    "accelerate>=1.0",
    "safetensors>=0.4.2",
    "wandb>=0.19",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "huggingface-hub>=0.30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
modal = [
    "modal>=1.6.4,<2",
]
exa = [
    "exa-py>=2.28,<3",
]

[project.scripts]
clh = "clharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: end-to-end smoke test (downloads model + SAEs; minutes)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
